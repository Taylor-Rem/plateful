<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="760" height="500" fill="#faf8f4"/><text x="36" y="44" font-size="20" font-weight="700" fill="#1c1917">Half of them can’t take an online order of their own</text><text x="36" y="68" font-size="13.5" fill="#57534e">Of 855 independent restaurants on the Wasatch Front, 453 (53%) have no direct online-ordering channel<tspan x="36" dy="18">— the shaded teal groups below.</tspan></text><text x="36" y="130" font-size="13" font-weight="600" fill="#57534e">Own online ordering</text><path d="M36,138 h476.0 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-476.0 z" fill="#a8a29e"/><text x="526.0" y="152" font-size="13" font-weight="700" fill="#1c1917">345</text><text x="556.0" y="152" font-size="12.5" fill="#78716c">40%</text><text x="36" y="186" font-size="13" font-weight="600" fill="#57534e">Website, but no way to order</text><path d="M36,194 h470.4347826086956 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-470.4347826086956 z" fill="#0d9488"/><text x="520.4347826086956" y="208" font-size="13" font-weight="700" fill="#1c1917">341</text><text x="550.4347826086956" y="208" font-size="12.5" fill="#78716c">40%</text><text x="36" y="242" font-size="13" font-weight="600" fill="#57534e">No website at all</text><path d="M36,250 h76.69565217391303 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-76.69565217391303 z" fill="#0d9488"/><text x="126.69565217391303" y="264" font-size="13" font-weight="700" fill="#1c1917">58</text><text x="148.69565217391303" y="264" font-size="12.5" fill="#78716c">7%</text><text x="36" y="298" font-size="13" font-weight="600" fill="#57534e">Delivery-app link only</text><path d="M36,306 h71.1304347826087 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-71.1304347826087 z" fill="#0d9488"/><text x="121.1304347826087" y="320" font-size="13" font-weight="700" fill="#1c1917">54</text><text x="143.1304347826087" y="320" font-size="12.5" fill="#78716c">6%</text><text x="36" y="354" font-size="13" font-weight="600" fill="#57534e">DoorDash Storefront only</text><path d="M36,362 h50.26086956521739 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-50.26086956521739 z" fill="#a8a29e"/><text x="100.26086956521739" y="376" font-size="13" font-weight="700" fill="#1c1917">39</text><text x="122.26086956521739" y="376" font-size="12.5" fill="#78716c">5%</text><text x="36" y="410" font-size="13" font-weight="600" fill="#57534e">Website unreachable</text><path d="M36,418 h21.043478260869563 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-21.043478260869563 z" fill="#a8a29e"/><text x="71.04347826086956" y="432" font-size="13" font-weight="700" fill="#1c1917">18</text><text x="93.04347826086956" y="432" font-size="12.5" fill="#78716c">2%</text><text x="36" y="482" font-size="11.5" fill="#78716c">Plateful analysis · 855 independent ($–$$) restaurants, 50 Wasatch Front cities · sites checked July 2026</text></svg>