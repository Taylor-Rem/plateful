<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><rect width="760" height="400" fill="#faf8f4"/><text x="36" y="44" font-size="20" font-weight="700" fill="#1c1917">57% can&#8217;t take an online order of their own</text><text x="36" y="68" font-size="13.5" fill="#57534e">852 Wasatch Front independents. The teal groups have no ordering channel of their own —<tspan x="36" dy="18">verified against every restaurant&#8217;s website AND the delivery platforms, August 2026.</tspan></text><text x="36" y="130" font-size="13" font-weight="600" fill="#57534e">Own online ordering (Toast, Olo, Square, …)</text><path d="M36,138 h476 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-476 z" fill="#a8a29e"/><text x="526" y="152" font-size="13" font-weight="700" fill="#1c1917">366</text><text x="558" y="152" font-size="12.5" fill="#78716c">43%</text><text x="36" y="186" font-size="13" font-weight="600" fill="#57534e">Marketplace apps only (DoorDash / Uber Eats / Grubhub listing)</text><path d="M36,194 h402 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-402 z" fill="#0d9488"/><text x="452" y="208" font-size="13" font-weight="700" fill="#1c1917">309</text><text x="484" y="208" font-size="12.5" fill="#78716c">36%</text><text x="36" y="242" font-size="13" font-weight="600" fill="#57534e">&#8220;Own&#8221; ordering actually hosted by DoorDash Storefront</text><path d="M36,250 h208 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-208 z" fill="#0d9488"/><text x="258" y="264" font-size="13" font-weight="700" fill="#1c1917">160</text><text x="290" y="264" font-size="12.5" fill="#78716c">19%</text><text x="36" y="298" font-size="13" font-weight="600" fill="#57534e">No online ordering anywhere (verified)</text><path d="M36,306 h22 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-22 z" fill="#0d9488"/><text x="72" y="320" font-size="13" font-weight="700" fill="#1c1917">17</text><text x="94" y="320" font-size="12.5" fill="#78716c">2%</text><text x="36" y="374" font-size="11.5" fill="#78716c">Plateful analysis &#183; 852 independent ($&#8211;$$) restaurants, 50 Wasatch Front cities &#183; websites checked July 2026, platforms verified August 2026</text></svg>
